name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/meshstage-mobile-studio-vnh850', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves from /<repo>/, so the bundle needs a matching base path.
      - name: Build
        run: npm run build:pages

      # Pages has no SPA rewrite. The studio is a single route, but a stray
      # deep link should still land on the app rather than a 404 page.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
